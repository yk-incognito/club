<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Rivora Club | Treasury Portal</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/navbar.css">
</head>
<body>
  <div class="container" style="margin-top: 2rem;">
    <h2>Treasury Management & Payment Portal</h2>
    
    <!-- Member Defaulters Filter & Actions (Treasury Officers Only) -->
    <div style="background: white; padding: 1.5rem; border-radius: var(--radius-md); margin-top: 1.5rem;">
      <h3>Multi-Month Advance Payment Logger</h3>
      <form id="advance-pay-form" style="display: grid; gap: 1rem; max-width: 500px; margin-top: 1rem;">
        <label>Member Register Number:
          <input type="number" id="pay-reg-no" required placeholder="e.g. 1001" style="width: 100%; padding: 0.5rem;">
        </label>
        
        <label>Months Covered (Hold Ctrl/Cmd to select multiple):
          <select id="pay-months" multiple required style="width: 100%; padding: 0.5rem; height: 110px;">
            <option value="2026-10">October 2026</option>
            <option value="2026-11">November 2026</option>
            <option value="2026-12">December 2026</option>
            <option value="2027-01">January 2027</option>
          </select>
        </label>

        <label>Total Collected Amount (₹):
          <input type="number" id="pay-total-amount" required style="width: 100%; padding: 0.5rem;">
        </label>

        <button type="submit" class="btn btn-primary">Record Payment</button>
      </form>
    </div>

    <!-- Quick WhatsApp Reminder Generator -->
    <div style="background: white; padding: 1.5rem; border-radius: var(--radius-md); margin-top: 1.5rem;">
      <h3>Pending Dues & Direct WhatsApp Ping</h3>
      <table style="width: 100%; border-collapse: collapse; margin-top: 1rem;">
        <thead>
          <tr style="text-align: left; border-bottom: 2px solid #e2e8f0;">
            <th>Reg No</th>
            <th>Name</th>
            <th>Months Unpaid</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="dues-tbody">
          <tr style="border-bottom: 1px solid #f1f5f9;">
            <td>1004</td>
            <td>Rahul M (Sunny)</td>
            <td><span class="badge badge-pending">3 Months (₹450)</span></td>
            <td>
              <a href="https://wa.me/919999999999?text=Dear%20Sunny,%20friendly%20reminder%20from%20Rivora%20Club%20to%20clear%20your%20monthly%20subscription%20dues." 
                 target="_blank" 
                 class="btn btn-accent" 
                 style="padding: 0.25rem 0.75rem; font-size: 0.85rem;">
                 WhatsApp Reminder
              </a>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</body>
</html>
