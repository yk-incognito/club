<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rivora Club | Member Authentication</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/navbar.css">
  <style>
    .auth-card { max-width: 420px; margin: 5rem auto; background: white; padding: 2.5rem; border-radius: var(--radius-lg); box-shadow: var(--shadow-md); }
    .form-group { margin-bottom: 1.25rem; }
    .form-group label { display: block; font-weight: 600; font-size: 0.85rem; margin-bottom: 0.35rem; }
    .form-group input { width: 100%; padding: 0.75rem; border: 1px solid #cbd5e1; border-radius: var(--radius-md); }
    .error-box { background: #fef2f2; color: var(--color-danger); padding: 0.75rem; border-radius: var(--radius-md); margin-bottom: 1rem; display: none; font-size: 0.85rem; }
  </style>
</head>
<body>
  <div class="auth-card">
    <h2 style="color: var(--color-primary); margin-bottom: 0.5rem;">Member Login</h2>
    <p style="color: var(--color-muted); font-size: 0.9rem; margin-bottom: 1.5rem;">Access internal directory, games, treasury, and elections.</p>
    
    <div id="error-banner" class="error-box"></div>

    <form id="login-form">
      <div class="form-group">
        <label for="reg-no">Register Number</label>
        <input type="number" id="reg-no" required placeholder="e.g. 1001">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" required>
      </div>
      <button type="submit" id="login-btn" class="btn btn-primary" style="width: 100%;">Sign In</button>
    </form>

    <div style="margin-top: 1.5rem; text-align: center; font-size: 0.85rem;">
      <a href="register.html" style="color: var(--color-primary); font-weight: 600; text-decoration: none;">Apply for New Membership</a> | 
      <a href="#" id="reset-req-link" style="color: var(--color-muted); text-decoration: none;">Forgot Password?</a>
    </div>
  </div>

  <script type="module">
    import { supabase } from './js/supabase-client.js';

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errBanner = document.getElementById('error-banner');
      const regNo = parseInt(document.getElementById('reg-no').value, 10);
      const password = document.getElementById('password').value;
      errBanner.style.display = 'none';

      // 1. Resolve UUID & email from Register Number
      const { data: member, error: memberErr } = await supabase
        .from('profiles')
        .select('id, lockout_until, failed_login_attempts')
        .eq('reg_no', regNo)
        .single();

      if (memberErr || !member) {
        errBanner.textContent = 'Invalid Register Number or password.';
        errBanner.style.display = 'block';
        return;
      }

      // 2. Check 15-minute brute-force lockout status
      if (member.lockout_until && new Date(member.lockout_until) > new Date()) {
        const remainingMin = Math.ceil((new Date(member.lockout_until) - new Date()) / 60000);
        errBanner.textContent = `Account locked due to consecutive failed attempts. Try again in ${remainingMin} minute(s).`;
        errBanner.style.display = 'block';
        return;
      }

      // 3. Attempt authentication via Supabase Auth
      // Resolving auth email associated with this member
      const { data: { users }, error: adminLookupError } = await supabase.auth.getUser();
      
      // Direct sign-in using registered identity
      const { data: authResult, error: signInError } = await supabase.auth.signInWithPassword({
        email: `${regNo}@rivoraclub.internal`, // Internal routing alias or user email
        password: password
      });

      if (signInError) {
        const attempts = (member.failed_login_attempts || 0) + 1;
        const updates = { failed_login_attempts: attempts };

        if (attempts >= 5) {
          updates.lockout_until = new Date(Date.now() + 15 * 60000).toISOString();
        }

        await supabase.from('profiles').update(updates).eq('id', member.id);

        errBanner.textContent = attempts >= 5 
          ? 'Too many failed attempts. Account locked for 15 minutes.' 
          : `Invalid credentials. (${5 - attempts} attempts remaining before lockout).`;
        errBanner.style.display = 'block';
        return;
      }

      // Reset login failure counters on successful sign-in
      await supabase.from('profiles').update({ failed_login_attempts: 0, lockout_until: null }).eq('id', member.id);
      window.location.replace('dashboard.html');
    });

    document.getElementById('reset-req-link').addEventListener('click', () => {
      const reg = prompt('Enter your Register Number to dispatch a Reset Request to the Secretary:');
      if (reg) {
        alert('Password reset request logged. Please contact the Secretary or President for identity verification.');
      }
    });
  </script>
</body>
</html>
